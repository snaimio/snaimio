<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .kicker { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 3px; fill: #10B981; text-transform: uppercase; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #94A3B8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #CBD5E1; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #E2E8F0; }
  </style>

  <!-- Card Background -->
  <rect width="860" height="220" rx="16" fill="url(#bgGrad)" />
  <rect width="860" height="220" rx="16" fill="url(#ambientGlow)" />
  <rect width="860" height="220" rx="16" fill="url(#grid)" />
  <rect width="860" height="220" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="860" height="3" fill="url(#accentLine)" rx="1.5" />

  <!-- Kicker -->
  <text x="44" y="52" class="kicker">Mobile Software Engineer</text>

  <!-- Name -->
  <text x="44" y="94" class="title">Sheikh Naim</text>

  <!-- Subtitle -->
  <text x="44" y="126" class="subtitle">Building performant, native iOS (SwiftUI) &amp; Android (Jetpack Compose) applications.</text>

  <!-- Badges / Tags -->
  <!-- Tag 1: iOS -->
  <g transform="translate(44, 150)">
    <rect width="112" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="tag-text">🍎 iOS · SwiftUI</text>
  </g>

  <!-- Tag 2: Android -->
  <g transform="translate(164, 150)">
    <rect width="136" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="tag-text">🤖 Android · Compose</text>
  </g>

  <!-- Tag 3: triOS College -->
  <g transform="translate(308, 150)">
    <rect width="138" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="tag-text">🎓 triOS College '27</text>
  </g>

  <!-- Tag 4: Location -->
  <g transform="translate(454, 150)">
    <rect width="124" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" class="tag-text">📍 Toronto, Canada</text>
  </g>

  <!-- Right side: Status indicator pill -->
  <g transform="translate(620, 40)">
    <rect width="196" height="32" rx="16" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <!-- Glowing green dot -->
    <circle cx="20" cy="16" r="4" fill="#10B981" />
    <circle cx="20" cy="16" r="7" fill="#10B981" fill-opacity="0.3" />
    <text x="34" y="20" class="status-text">Available for Mobile Roles</text>
  </g>
</svg>
