<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="45%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .kicker { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3.5px; fill: #10B981; text-transform: uppercase; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.8px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #94A3B8; letter-spacing: -0.2px; }
    .tag-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #E2E8F0; }
    .status-pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Card Background -->
  <rect width="920" height="280" rx="18" fill="url(#bgGrad)" />
  <rect width="920" height="280" rx="18" fill="url(#emeraldGlow)" />
  <rect width="920" height="280" rx="18" fill="url(#blueGlow)" />
  <rect width="920" height="280" rx="18" fill="url(#grid)" />
  <rect width="920" height="280" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Top Multi-Color Gradient Bar -->
  <rect x="0" y="0" width="920" height="4" fill="url(#accentLine)" rx="2" />

  <!-- Top Status Pill (Right Aligned) -->
  <g transform="translate(680, 36)">
    <rect width="192" height="34" rx="17" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#10B981" />
    <circle cx="20" cy="17" r="8" fill="#10B981" fill-opacity="0.25" />
    <text x="36" y="21.5" class="status-pill-text">Available for Roles</text>
  </g>

  <!-- Kicker -->
  <text x="48" y="60" class="kicker">✦ MOBILE SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="48" y="118" class="title">Sheikh Naim</text>

  <!-- Subtitle -->
  <text x="48" y="156" class="subtitle">Building performant, native iOS &amp; Android systems with modern reactive architectures.</text>

  <!-- Badges / Metadata Tags Row -->
  <!-- Tag 1: iOS & SwiftUI -->
  <g transform="translate(48, 192)">
    <rect width="160" height="36" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <!-- Apple Vector Icon -->
    <path d="M 22 17.5 C 22.8 16.5 23.3 15.1 23.1 13.8 C 21.9 13.9 20.4 14.6 19.6 15.6 C 18.9 16.4 18.3 17.8 18.5 19.1 C 19.8 19.2 21.2 18.4 22 17.5 Z M 23.2 19.3 C 21.3 19.3 20.3 20.4 19.1 20.4 C 17.8 20.4 16.6 19.3 15.2 19.3 C 13.1 19.3 11 21 11 24.3 C 11 26.4 11.8 28.6 12.8 30.1 C 13.7 31.4 14.7 32.8 16.1 32.8 C 17.4 32.8 18 31.9 19.4 31.9 C 20.8 31.9 21.3 32.8 22.7 32.8 C 24.1 32.8 25.1 31.5 26 30.1 C 26.7 29.1 27.2 27.8 27.4 27.2 C 24.2 25.9 23.9 21.3 26.8 19.9 C 25.8 18.4 24.2 19.3 23.2 19.3 Z" fill="#F8FAFC" transform="translate(3, -2) scale(0.85)" />
    <text x="36" y="23" class="tag-label">iOS · SwiftUI</text>
  </g>

  <!-- Tag 2: Android & Jetpack Compose -->
  <g transform="translate(220, 192)">
    <rect width="210" height="36" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <!-- Android Robot Icon -->
    <circle cx="24" cy="18" r="7" fill="#3DDC84" />
    <circle cx="21.5" cy="16.5" r="1" fill="#0F172A" />
    <circle cx="26.5" cy="16.5" r="1" fill="#0F172A" />
    <text x="38" y="23" class="tag-label">Android · Compose</text>
  </g>

  <!-- Tag 3: triOS College -->
  <g transform="translate(442, 192)">
    <rect width="186" height="36" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <!-- Graduation Cap Icon -->
    <path d="M 16 19 L 24 15 L 32 19 L 24 23 Z M 20 22 L 20 25 C 20 26.5 21.8 27.5 24 27.5 C 26.2 27.5 28 26.5 28 25 L 28 22" fill="none" stroke="#F8FAFC" stroke-width="1.3" />
    <text x="38" y="23" class="tag-label">triOS College '27</text>
  </g>

  <!-- Tag 4: Toronto, Canada -->
  <g transform="translate(640, 192)">
    <rect width="176" height="36" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <!-- Map Pin Icon -->
    <path d="M 24 13 C 21.5 13 19.5 15 19.5 17.5 C 19.5 21 24 26 24 26 C 24 26 28.5 21 28.5 17.5 C 28.5 15 26.5 13 24 13 Z M 24 19 C 23.2 19 22.5 18.3 22.5 17.5 C 22.5 16.7 23.2 16 24 16 C 24.8 16 25.5 16.7 25.5 17.5 C 25.5 18.3 24.8 19 24 19 Z" fill="#F8FAFC" transform="translate(-4, 0)" />
    <text x="34" y="23" class="tag-label">Toronto, Canada</text>
  </g>
</svg>
